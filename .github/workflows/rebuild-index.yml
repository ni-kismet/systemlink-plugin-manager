name: Rebuild Index

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: main-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild Packages index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rebuild Packages index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/rebuild_index.py

      - name: Commit updated Packages files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ github.ref_name }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add Packages Packages.gz
          if git diff --cached --quiet; then
            echo "No changes to Packages index."
          else
            git commit -m "chore: rebuild Packages index [skip ci]"
            for attempt in 1 2 3; do
              if git push origin HEAD:"$TARGET_BRANCH"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "✗ Failed to push rebuilt Packages index after $attempt attempts." >&2
                exit 1
              fi

              git fetch origin "$TARGET_BRANCH"
              git rebase "origin/$TARGET_BRANCH"
            done
          fi

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: rebuild
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Pull latest (index may have been updated)
        run: git pull --ff-only

      - name: Prepare Pages content
        run: |
          mkdir -p _site
          # Landing page and static assets
          cp -r docs/. _site/ 2>/dev/null || true
          # Feed index files served at the same root URL
          cp Packages _site/ 2>/dev/null || true
          cp Packages.gz _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
