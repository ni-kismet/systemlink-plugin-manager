name: Publish Plugin Manager Webapp

on:
  push:
    branches: [main]
    paths:
      - 'change/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: main-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish webapp
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-systemlink-plugin-manager
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Bump version (beachball)
        run: |
          npx beachball bump --no-push
          echo "Bumped. New version: $(jq -r '.version' webapp/package.json)"

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' webapp/package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=systemlink-plugin-manager-v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Sync version to nipkg config and models
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          jq --arg v "$VERSION" '.version = $v' \
            webapp/nipkg.config.json > tmp.json \
            && mv tmp.json webapp/nipkg.config.json

          sed -i "s/export const PLUGIN_MANAGER_VERSION = '.*';/export const PLUGIN_MANAGER_VERSION = '${VERSION}';/" \
            webapp/src/app/models/plugin-manager.models.ts

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      - name: Build webapp
        run: npm run build
        working-directory: webapp

      - name: Commit release files locally
        run: |
          git add webapp/package.json webapp/CHANGELOG.md \
                  webapp/nipkg.config.json \
                  webapp/src/app/models/plugin-manager.models.ts \
                  change/
          if git diff --cached --quiet; then
            echo "Release files already committed."
          else
            git commit -m "chore: bump plugin manager to ${{ steps.version.outputs.version }} [skip ci]"
          fi

      - name: Reuse published package on retry
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          python scripts/release_utils.py reuse-webapp \
            --tag "$RELEASE_TAG" \
            --output-dir webapp/dist/nipkg \
            --manifest submissions/systemlink-plugin-manager/manifest.json

      - name: Package nipkg and submission manifest
        if: steps.reuse.outputs.reused != 'true'
        id: build_package
        run: |
          rm -rf dist/nipkg
          ./node_modules/.bin/sl-webapp-nipkg build \
            --config nipkg.config.json \
            --output-dir dist/nipkg \
            --manifest \
            --manifest-output ../submissions/systemlink-plugin-manager/manifest.json \
            --source-repo ni-kismet/systemlink-plugin-manager \
            --release-tag "${{ steps.version.outputs.tag }}" \
            --source-commit "$(git rev-parse HEAD)"
          NIPKG=$(find dist/nipkg -maxdepth 1 -name '*.nipkg' | head -1)
          if [ -z "$NIPKG" ]; then
            echo "✗ Packaging did not produce a .nipkg file" >&2
            exit 1
          fi
          # Output paths relative to repo root for subsequent steps
          echo "path=webapp/$NIPKG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$NIPKG")" >> "$GITHUB_OUTPUT"
        working-directory: webapp

      - name: Select release package
        id: package
        env:
          REUSED: ${{ steps.reuse.outputs.reused }}
          REUSED_PATH: ${{ steps.reuse.outputs.path }}
          REUSED_NAME: ${{ steps.reuse.outputs.name }}
          BUILT_PATH: ${{ steps.build_package.outputs.path }}
          BUILT_NAME: ${{ steps.build_package.outputs.name }}
        run: |
          if [ "$REUSED" = "true" ]; then
            echo "path=$REUSED_PATH" >> "$GITHUB_OUTPUT"
            echo "name=$REUSED_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "path=$BUILT_PATH" >> "$GITHUB_OUTPUT"
            echo "name=$BUILT_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated submission manifest
        run: |
          git add submissions/systemlink-plugin-manager/manifest.json
          if git diff --cached --quiet; then
            echo "Manifest already up to date."
          else
            git commit -m "chore: update submission manifest for ${{ steps.version.outputs.version }} [skip ci]"
          fi

      - name: Push release commits
        run: bash scripts/git-push-with-retry.sh "${{ github.ref_name }}"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: ${{ steps.package.outputs.path }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CHANGELOG=$(awk -v version="$VERSION" '
            $0 == "## " version {
              in_section = 1
              next
            }
            in_section && /^## / {
              exit
            }
            in_section {
              if (!started && $0 == "") {
                next
              }
              started = 1
              lines[++count] = $0
            }
            END {
              while (count > 0 && lines[count] == "") {
                count--
              }
              for (i = 1; i <= count; i++) {
                print lines[i]
              }
            }
          ' webapp/CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release of Plugin Manager for SystemLink version ${VERSION}"
          fi
          python scripts/release_utils.py publish \
            --artifact "$ARTIFACT_PATH" \
            --manifest submissions/systemlink-plugin-manager/manifest.json \
            --target "$(git rev-parse HEAD)" \
            --notes "$CHANGELOG" \
            --latest

      - name: Trigger index rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run rebuild-index.yml --ref main
