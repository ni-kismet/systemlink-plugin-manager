name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
  workflow_dispatch:
    inputs:
      submission:
        description: 'Submission directory name (under submissions/)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  detect:
    name: Detect submissions to publish
    runs-on: ubuntu-latest
    outputs:
      submissions: ${{ steps.detect.outputs.submissions }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed submissions
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SUBMISSION: ${{ inputs.submission }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SUBMISSIONS=$(jq -n -c --arg submission "$INPUT_SUBMISSION" '[ $submission ]')
          else
            # Detect submission directories changed in this push.
            # Exclude systemlink-plugin-manager (published by publish-webapp pipeline).
            SUBMISSIONS=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" \
              | grep '^submissions/' \
              | cut -d'/' -f2 \
              | sort -u \
              | grep -v '^systemlink-plugin-manager$' \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "submissions=$SUBMISSIONS" >> "$GITHUB_OUTPUT"
          echo "Will publish: $SUBMISSIONS"

  publish:
    name: Publish ${{ matrix.submission }}
    needs: detect
    if: ${{ needs.detect.outputs.submissions != '[]' && needs.detect.outputs.submissions != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}-${{ matrix.submission }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        submission: ${{ fromJson(needs.detect.outputs.submissions) }}
    env:
      SUBMISSION_NAME: ${{ matrix.submission }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Locate release artifact
        id: artifact
        run: |
          [[ "$SUBMISSION_NAME" =~ ^[A-Za-z0-9._-]+$ && "$SUBMISSION_NAME" != "." && "$SUBMISSION_NAME" != ".." ]] || { echo "✗ Invalid submission name: $SUBMISSION_NAME" >&2; exit 1; }
          DIR="submissions/${SUBMISSION_NAME}"
          if [ ! -f "$DIR/manifest.json" ]; then
            echo "✗ No manifest.json found in $DIR" >&2
            exit 1
          fi

          EXPLICIT=$(jq -r '.nipkgFile' "$DIR/manifest.json")
          [[ "$EXPLICIT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.nipkg$ ]] || { echo "✗ Invalid nipkgFile: $EXPLICIT" >&2; exit 1; }
          SOURCE_REPO=$(jq -r '.sourceRepo // empty' "$DIR/manifest.json")
          RELEASE_TAG=$(jq -r '.releaseTag // empty' "$DIR/manifest.json")
          FOUND=""

          if [ -n "$EXPLICIT" ] && [ -f "$DIR/$EXPLICIT" ]; then
            FOUND="$DIR/$EXPLICIT"
          fi

          if [ -n "$FOUND" ]; then
            echo "build_webapp=false" >> "$GITHUB_OUTPUT"
            echo "path=$FOUND" >> "$GITHUB_OUTPUT"
            echo "name=$(basename "$FOUND")" >> "$GITHUB_OUTPUT"
          elif [ "$SUBMISSION_NAME" = "systemlink-plugin-manager" ]; then
            echo "build_webapp=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$SOURCE_REPO" ] && [ -n "$RELEASE_TAG" ]; then
            [[ "$SOURCE_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "✗ Invalid sourceRepo: $SOURCE_REPO" >&2; exit 1; }
            [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "✗ Invalid releaseTag: $RELEASE_TAG" >&2; exit 1; }
            [[ "$EXPLICIT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.nipkg$ ]] || { echo "✗ Invalid nipkgFile: $EXPLICIT" >&2; exit 1; }
            echo "download_remote=true" >> "$GITHUB_OUTPUT"
            echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
            echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "name=$EXPLICIT" >> "$GITHUB_OUTPUT"
          else
            echo "✗ No .nipkg artifact found in $DIR for manifest nipkgFile=$EXPLICIT" >&2
            exit 1
          fi

      - name: Download submission artifact from source release
        if: steps.artifact.outputs.download_remote == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.artifact.outputs.release_tag }}
          SOURCE_REPO: ${{ steps.artifact.outputs.source_repo }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          DEST_DIR="downloaded-artifacts/${SUBMISSION_NAME}"
          mkdir -p "$DEST_DIR"
          gh release download "$RELEASE_TAG" \
            --repo "$SOURCE_REPO" \
            --pattern "$ARTIFACT_NAME" \
            --dir "$DEST_DIR"
          echo "path=$DEST_DIR/$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
        id: download_artifact

      - uses: actions/setup-node@v7
        if: steps.artifact.outputs.build_webapp == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        if: steps.artifact.outputs.build_webapp == 'true'
        run: npm ci
        working-directory: webapp

      - name: Build webapp
        if: steps.artifact.outputs.build_webapp == 'true'
        run: npm run build
        working-directory: webapp

      - name: Package Plugin Manager for SystemLink webapp
        if: steps.artifact.outputs.build_webapp == 'true'
        id: build_nipkg
        run: |
          rm -rf dist/nipkg
          ./node_modules/.bin/sl-webapp-nipkg build \
            --config nipkg.config.json \
            --output-dir dist/nipkg
          NIPKG=$(find dist/nipkg -maxdepth 1 -name '*.nipkg' | head -1)
          if [ -z "$NIPKG" ]; then
            echo "✗ Packaging did not produce a .nipkg file" >&2
            exit 1
          fi
          # Output paths relative to repo root for subsequent steps
          echo "path=webapp/$NIPKG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$NIPKG")" >> "$GITHUB_OUTPUT"
        working-directory: webapp

      - name: Select release artifact
        id: release_artifact
        env:
          BUILD_WEBAPP: ${{ steps.artifact.outputs.build_webapp }}
          DOWNLOAD_REMOTE: ${{ steps.artifact.outputs.download_remote }}
          BUILT_PATH: ${{ steps.build_nipkg.outputs.path }}
          BUILT_NAME: ${{ steps.build_nipkg.outputs.name }}
          DOWNLOADED_PATH: ${{ steps.download_artifact.outputs.path }}
          DOWNLOADED_NAME: ${{ steps.download_artifact.outputs.name }}
          LOCAL_PATH: ${{ steps.artifact.outputs.path }}
          LOCAL_NAME: ${{ steps.artifact.outputs.name }}
        run: |
          if [ "$BUILD_WEBAPP" = "true" ]; then
            echo "path=$BUILT_PATH" >> "$GITHUB_OUTPUT"
            echo "name=$BUILT_NAME" >> "$GITHUB_OUTPUT"
          elif [ "$DOWNLOAD_REMOTE" = "true" ]; then
            echo "path=$DOWNLOADED_PATH" >> "$GITHUB_OUTPUT"
            echo "name=$DOWNLOADED_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "path=$LOCAL_PATH" >> "$GITHUB_OUTPUT"
            echo "name=$LOCAL_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release artifact hash
        env:
          RELEASE_ARTIFACT_PATH: ${{ steps.release_artifact.outputs.path }}
        run: |
          EXPECTED_SHA=$(jq -r '.sha256' "submissions/${SUBMISSION_NAME}/manifest.json")
          ACTUAL_SHA=$(shasum -a 256 "$RELEASE_ARTIFACT_PATH" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "✗ Release artifact sha256 does not match manifest.json" >&2
            exit 1
          fi

      - name: Read package metadata
        id: package_metadata
        env:
          RELEASE_ARTIFACT_PATH: ${{ steps.release_artifact.outputs.path }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from submission_utils import (
              extract_control_fields,
              metadata_from_control_fields,
              validate_package_metadata,
          )

          artifact = Path(os.environ["RELEASE_ARTIFACT_PATH"])
          control_fields = extract_control_fields(artifact)
          metadata = metadata_from_control_fields(control_fields)
          errors = validate_package_metadata(
              metadata,
              artifact.parent.name,
              require_embedded_icon=True,
          )
          if errors:
              raise ValueError("\n".join(errors))

          print(f"package={metadata['package']}")
          print(f"version={metadata['version']}")
          print(f"display_name={metadata['displayName']}")
          PY

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PATH: ${{ steps.release_artifact.outputs.path }}
          DISPLAY_NAME: ${{ steps.package_metadata.outputs.display_name }}
          VERSION: ${{ steps.package_metadata.outputs.version }}
        run: |
          python scripts/release_utils.py publish \
            --artifact "$ARTIFACT_PATH" \
            --manifest "submissions/${SUBMISSION_NAME}/manifest.json" \
            --target "$GITHUB_SHA" \
            --notes "Release of ${DISPLAY_NAME} version ${VERSION}"

      - name: Trigger index rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run rebuild-index.yml --ref main
