name: Test Release Publishing

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test write-once release publishing
        run: |
          python -m unittest discover -s scripts/tests -v
          python scripts/test_submission_utils.py
