name: Validate Submission

on:
  pull_request:
    paths:
      - 'submissions/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate app submission
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect changed submissions
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Find submission directories that were changed in this PR
          # Use env var to avoid script injection via branch name
          DIRS=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
            | grep '^submissions/' \
            | cut -d'/' -f1-2 \
            | sort -u)
          echo "dirs<<EOF" >> "$GITHUB_OUTPUT"
          echo "$DIRS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate manifests against schema
        env:
          CHANGED_DIRS: ${{ steps.changed.outputs.dirs }}
        run: |
          pip install jsonschema
          python -c "
          import json, os, sys
          from jsonschema import validate, ValidationError
          from pathlib import Path

          schema = json.loads(Path('app-manifest.schema.json').read_text())
          dirs = os.environ.get('CHANGED_DIRS', '').strip().splitlines()
          errors = []
          for d in dirs:
              d = d.strip()
              if not d:
                  continue
              # Validate directory name contains only safe characters
              if not all(c.isalnum() or c in '-_./=' for c in d):
                  errors.append(f'{d}: directory name contains invalid characters')
                  continue
              manifest_path = Path(d) / 'manifest.json'
              if not manifest_path.is_file():
                  errors.append(f'{d}: missing manifest.json')
                  continue
              try:
                  manifest = json.loads(manifest_path.read_text())
                  validate(instance=manifest, schema=schema)
                  print(f'✓ {d}: schema valid')
              except ValidationError as e:
                  errors.append(f'{d}: {e.message}')
              except json.JSONDecodeError as e:
                  errors.append(f'{d}: invalid JSON: {e}')
          if errors:
              for e in errors:
                  print(f'✗ {e}', file=sys.stderr)
              sys.exit(1)
          print('All manifests valid.')
          "

      - name: Validate resolved .nipkg artifacts
        env:
          CHANGED_DIRS: ${{ steps.changed.outputs.dirs }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          from release_utils import check_submission, destination_repository
          from submission_utils import (
              MAX_NIPKG_SIZE_BYTES,
              extract_control_fields,
              find_nipkg,
              metadata_from_control_fields,
              resolve_submission_nipkg,
              sha256_file,
              validate_nipkg_archive,
              validate_package_metadata,
          )

          dirs = os.environ.get('CHANGED_DIRS', '').strip().splitlines()
          errors = []

          for dir_name in dirs:
              dir_name = dir_name.strip()
              if not dir_name:
                  continue

              submission_dir = Path(dir_name)
              manifest = json.loads((submission_dir / 'manifest.json').read_text())
              local_nipkg = find_nipkg(submission_dir, manifest)

              try:
                  nipkg_path = resolve_submission_nipkg(
                      submission_dir,
                      manifest,
                      user_agent='systemlink-plugin-manager-validate',
                  )
              except Exception as exc:
                  errors.append(f'[{submission_dir.name}] {exc}')
                  continue

              if nipkg_path is None or not nipkg_path.is_file():
                  errors.append(
                      f'[{submission_dir.name}] Could not resolve .nipkg artifact {manifest.get("nipkgFile", "")!r}'
                  )
                  continue

              actual_sha = sha256_file(nipkg_path)
              if actual_sha != manifest['sha256']:
                  errors.append(f'[{submission_dir.name}] sha256 does not match the submitted .nipkg')
                  continue

              archive_errors = validate_nipkg_archive(nipkg_path, submission_dir.name)
              if archive_errors:
                  errors.extend(archive_errors)
                  continue

              try:
                  control_fields = extract_control_fields(nipkg_path)
                  metadata = metadata_from_control_fields(control_fields)
              except Exception as exc:
                  errors.append(f'[{submission_dir.name}] {exc}')
                  continue

              metadata_errors = validate_package_metadata(
                  metadata,
                  submission_dir.name,
                  require_embedded_icon=True,
              )
              if metadata_errors:
                  errors.extend(metadata_errors)
                  continue

              size = nipkg_path.stat().st_size
              if size > MAX_NIPKG_SIZE_BYTES:
                  errors.append(
                      f'[{submission_dir.name}] {nipkg_path.name} is {size} bytes (max {MAX_NIPKG_SIZE_BYTES})'
                  )
                  continue

              try:
                  check_submission(
                      destination_repository(),
                      f"{metadata['package']}-v{metadata['version']}",
                      manifest["nipkgFile"],
                      actual_sha,
                  )
              except (RuntimeError, ValueError, OSError) as exc:
                  errors.append(f'[{submission_dir.name}] {exc}')
                  continue

              location = 'local' if local_nipkg is not None else 'remote'
              print(f'✓ {submission_dir}: validated {location} artifact {nipkg_path.name} ({size} bytes)')

          if errors:
              for error in errors:
                  print(f'✗ {error}', file=sys.stderr)
              sys.exit(1)
          PY

      - name: Run full validation
        run: python scripts/rebuild_index.py --validate-only
